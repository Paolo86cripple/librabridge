name: Build AGS + librashader (Linux x86_64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ags_ref:
        description: 'adventuregamestudio/ags branch, tag or commit to build (empty = the pinned revision)'
        required: false
        default: ''
      librashader_ref:
        description: 'SnowflakePowered/librashader branch, tag or commit to build (empty = the pinned revision)'
        required: false
        default: ''
  schedule:
    # Nightly canary: builds the TIP of AGS and librashader (both default branches are
    # called "master") so that an upstream change that breaks the patch or the librashader
    # ABI is noticed here. It publishes a separate "-canary" artifact.
    - cron: '0 2 * * *'

env:
  # Known-good revisions, used by push and manual runs unless overridden above.
  # AGS is patched by librashader-integration.patch and librashader's C API is
  # called through the vendored Engine/gfx/librashader/librashader.h, so the two
  # have to move together with the patch: to update, bump both here, check that the
  # patch still applies (git apply --check) and that the build and a game still work.
  AGS_PINNED: c53a80181f103d34893495686f43f1efd3612fab            # 2026-09-20
  LIBRASHADER_PINNED: 87e8a97b50516d997defeaa168173dcd185d4022    # 2026-07-04, v0.12.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick the revisions to build
        env:
          EVENT: ${{ github.event_name }}
          INPUT_AGS: ${{ github.event.inputs.ags_ref }}
          INPUT_LIBRASHADER: ${{ github.event.inputs.librashader_ref }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            ags=master
            librashader=master
            artifact=ags-librashader-linux-x86_64-canary
          else
            ags="${INPUT_AGS:-$AGS_PINNED}"
            librashader="${INPUT_LIBRASHADER:-$LIBRASHADER_PINNED}"
            artifact=ags-librashader-linux-x86_64
          fi
          {
            echo "AGS_REF=$ags"
            echo "LIBRASHADER_REF=$librashader"
            echo "ARTIFACT_NAME=$artifact"
          } >> "$GITHUB_ENV"
          echo "AGS: $ags | librashader: $librashader | artifact: $artifact"

      - name: Checkout librabridge
        uses: actions/checkout@v4
        with:
          path: librabridge

      - name: Checkout AGS
        uses: actions/checkout@v4
        with:
          repository: adventuregamestudio/ags
          ref: ${{ env.AGS_REF }}
          path: ags

      - name: Apply librashader patch
        run: |
          cd ags
          git apply --check ../librabridge/librashader-integration.patch || {
            echo "::error::Patch failed! The librashader-integration.patch needs to be rebased for AGS ${AGS_REF}"
            echo "Please update the patch file and push to librabridge repository"
            exit 1
          }
          git apply ../librabridge/librashader-integration.patch

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout librashader
        uses: actions/checkout@v4
        with:
          repository: SnowflakePowered/librashader
          ref: ${{ env.LIBRASHADER_REF }}
          path: librashader

      - name: Check that pinned revisions were really checked out
        run: |
          for pair in "ags:$AGS_REF" "librashader:$LIBRASHADER_REF"; do
            dir="${pair%%:*}"; want="${pair#*:}"
            if [[ "$want" =~ ^[0-9a-f]{40}$ ]]; then
              got="$(git -C "$dir" rev-parse HEAD)"
              if [ "$got" != "$want" ]; then
                echo "::error::$dir is at $got, expected $want"
                exit 1
              fi
            fi
          done

      - name: Build librashader.so (OpenGL runtime only)
        run: |
          cd librashader
          cargo build --release -p librashader-capi --no-default-features --features runtime-opengl
          rustc --version

      # Same package list AGS's own CI uses to build SDL2 (via CMake
      # FetchContent) with full OpenGL/X11/Wayland support on Ubuntu.
      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev

      - name: Install Qt6 for agssetup GUI
        run: |
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ags/build/_deps
          key: fetchcontent-${{ runner.os }}-${{ env.AGS_REF }}-${{ hashFiles('ags/CMakeLists.txt', 'ags/CMake/Fetch*.cmake') }}

      - name: Configure CMake
        run: cmake -S ags -B ags/build -DCMAKE_BUILD_TYPE=Release

      - name: Build AGS engine (with the librashader patch applied)
        run: cmake --build ags/build --config Release --parallel 4

      - name: Build agssetup GUI (C++/Qt6)
        run: |
          cd librabridge
          qmake6 agssetup.pro
          make -j$(nproc)

      - name: Collect artifacts
        run: |
          pkg=pkg/ags-librashader
          mkdir -p "$pkg"
          find ags/build -maxdepth 2 -iname "ags" -type f -executable -exec cp {} "$pkg"/ \;
          cp librashader/target/release/liblibrashader_capi.so "$pkg/librashader.so"
          cp librabridge/agssetup "$pkg/agssetup"
          chmod +x "$pkg/ags" "$pkg/agssetup"   # fails the step if the engine was not found
          {
            echo "Built from AGS ${AGS_REF} ($(git -C ags rev-parse --short HEAD)), librashader ${LIBRASHADER_REF} ($(git -C librashader rev-parse --short HEAD))"
            echo "Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > "$pkg/BUILD_INFO.txt"
          # upload-artifact wraps its input in a zip, and a zip does not keep the executable
          # bit: ship a tarball, which does.
          tar -C pkg -czf ags-librashader-linux-x86_64.tar.gz ags-librashader

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ags-librashader-linux-x86_64.tar.gz
          if-no-files-found: error
